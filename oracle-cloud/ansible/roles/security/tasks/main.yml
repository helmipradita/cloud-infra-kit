---
# ==============================================================================
# Task: 02-security.yml (SSH Hardening & Fail2ban Host Protection)
# ==============================================================================

- name: Install security packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - nftables
    state: present

- name: Deploy SSH hardening config
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      ChallengeResponseAuthentication no
      UsePAM yes
  notify: Restart SSH

- name: Configure Fail2ban jail.local (nftables backend)
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 5
      backend = systemd

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      maxretry = 5
      bantime = 3600
  notify: Restart Fail2ban
